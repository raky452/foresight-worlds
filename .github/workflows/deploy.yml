name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
    paths: ['apps/tools-site/**']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tools-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install -g firebase-tools
      - run: python build.py
      - run: firebase deploy --only hosting --project technoforesight-in --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
